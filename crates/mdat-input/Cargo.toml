[package]
name = "mdat-input"
version = "0.1.0"
edition = "2021"
description = "Input seam (ReaderAdapter/ReaderSession) for mdat and mdat-view"
license = "MIT"
repository = "https://github.com/keejkrej/mdat-rs"
homepage = "https://github.com/keejkrej/mdat-rs"
documentation = "https://docs.rs/mdat-input"
readme = "../../README.md"
keywords = ["microscopy", "nd2", "czi", "bioimaging"]
categories = ["science", "parser-implementations"]

[lib]
name = "mdat_input"
path = "src/lib.rs"

[dependencies]
czi-rs = "0.2"
nd2-rs = "0.2"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "1.0"
tiff = "0.11"

[dev-dependencies]
tempfile = "3.14"
