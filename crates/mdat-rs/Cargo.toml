[package]
name = "mdat-rs"
version = "0.2.0"
edition = "2021"
description = "Microscopy data utilities for ND2/CZI files (convert, metadata, optional viewer)"
license = "MIT"
repository = "https://github.com/keejkrej/mdat-rs"
homepage = "https://github.com/keejkrej/mdat-rs"
documentation = "https://docs.rs/mdat-rs"
readme = "../../README.md"
keywords = ["microscopy", "nd2", "czi", "bioimaging", "cli"]
categories = ["science", "command-line-utilities"]
exclude = [
    ".scratch/",
    "web/node_modules/",
    "web/src/",
    "web/tests/",
    "web/package.json",
    "web/bun.lock",
    "web/tsconfig.json",
    "web/vite.config.ts",
    "web/README.md",
]

[lib]
# Rust import path stays `mdat::…` (package name on crates.io is mdat-rs).
name = "mdat"
path = "src/lib.rs"

[features]
default = ["view"]
# Local HTTP viewer (`mdat view`). Disable for a convert/metadata-only binary:
#   cargo install mdat-rs --no-default-features
view = [
    "dep:axum",
    "dep:base64",
    "dep:include_dir",
    "dep:rand",
    "dep:tower",
    "tokio/macros",
    "tokio/net",
    "tokio/signal",
    "tokio/time",
    "tokio/sync",
]

[[bin]]
name = "mdat"
path = "src/main.rs"

[dependencies]
czi = { git = "https://github.com/keejkrej/czi-rs" }
nd2 = { git = "https://github.com/keejkrej/nd2-rs" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tiff = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }

# view feature
axum = { version = "0.8", features = ["macros"], optional = true }
base64 = { version = "0.22", optional = true }
include_dir = { version = "0.7", features = ["glob"], optional = true }
rand = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[package.metadata.docs.rs]
all-features = true
