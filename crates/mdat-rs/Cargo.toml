[package]
name = "mdat-rs"
version = "1.0.0"
edition = "2021"
description = "Convert microscopy data to TIFF and inspect metadata"
license = "MIT"
repository = "https://github.com/keejkrej/mdat-rs"
documentation = "https://docs.rs/mdat-rs"
readme = "../../README.md"
keywords = ["microscopy", "nd2", "czi", "bioimaging", "cli"]
categories = ["science", "command-line-utilities"]

[lib]
# Rust import path stays `mdat::…` (package name on crates.io is mdat-rs).
name = "mdat"
path = "src/lib.rs"

[[bin]]
name = "mdat"
path = "src/main.rs"

[dependencies]
czi = "1.0"
nd2 = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tiff = "0.11"

[dev-dependencies]
tempfile = "3.14"
