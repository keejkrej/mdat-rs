[package]
name = "mdat-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for ND2/CZI microscopy readers"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
czi-rs = "0.2"
nd2-rs = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
